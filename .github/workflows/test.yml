name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Lint + decoder/client tests + Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pytest-homeassistant-custom-component tinytuya==1.21.1
      - run: python -m ruff check .
      # The decoder and client tests need no Home Assistant; the rest boot a real HA core with
      # tinytuya.Device replaced by a scripted fake, so the whole integration is exercised
      # end to end without a station.
      - run: python -m pytest tests/ -v -p no:cacheprovider
